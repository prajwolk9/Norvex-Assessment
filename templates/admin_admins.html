{% extends "base.html" %}
{% block content %}
<h2>Administrators</h2>
<table><tr><th>Name</th><th>Email</th></tr>
{% for u in rows %}<tr><td>{{ u['name'] }}</td><td>{{ u['email'] }}</td></tr>{% endfor %}</table>
<form method="post" class="panel narrow" style="margin:20px 0"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <h3>Add an administrator</h3>
  <label>Name<input name="name" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>Password (8+)<input type="password" name="password" minlength="8" required></label>
  <button class="btn">Create admin</button>
</form>
{% endblock %}
