{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>
<form method="post" class="panel narrow" style="margin:20px 0"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Default plays per song per candidate<input type="number" name="default_max_plays" min="1" value="{{ mp }}"></label>
  <label><input type="checkbox" name="show_score" {% if show %}checked{% endif %}> Show candidates their score after submitting (only when every question has an answer key or manual score)</label>
  <button class="btn">Save</button>
</form>
{% endblock %}
