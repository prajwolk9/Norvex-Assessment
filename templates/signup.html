{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<form method="post" class="panel narrow">
  <h2>Create your account</h2>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Full name<input name="name" required autofocus autocomplete="name"></label>
  <label>Email<input type="email" name="email" required autocomplete="username"></label>
  <label>Password (8+ characters)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
  <label>Confirm password<input type="password" name="password2" minlength="8" required autocomplete="new-password"></label>
  <button class="btn">Sign up &amp; start</button>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
